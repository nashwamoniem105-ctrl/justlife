<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص PCR المنزلي - جست لايف الإمارات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f7f9fa; margin: 0; padding: 0; direction: rtl; }
        .header { background: white; border-bottom: 1px solid #e5e8eb; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: #00c3ff; text-decoration: none; }
        .hero { background: linear-gradient(135deg, #003764 0%, #00c3ff 100%); color: white; padding: 60px 20px; text-align: center; }
        .container { max-width: 800px; margin: -30px auto 40px auto; padding: 0 20px; position: relative; z-index: 10; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .btn { background: #00c3ff; color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        input, select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">Justlife</a>
        <a href="/" style="background: #ebfaff; color: #00c3ff; padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;">الرئيسية</a>
    </div>

    <div class="hero">
        <h1 style="font-size: 36px; margin: 0 0 10px 0; font-weight: bold;">فحص PCR المنزلي</h1>
        <p style="font-size: 18px; opacity: 0.9; margin: 0;">فحص طبي معتمد في منزلك بسرعة وأمان</p>
    </div>

    <div class="container">
        <div class="card">
            <h2 style="color: #003764; font-size: 20px; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;">حجز موعد الفحص الطبي</h2>
            <form id="booking-form">
                <label>تاريخ ووقت الفحص:</label>
                <input type="datetime-local" id="b-date" required>
                <label>الاسم الكامل:</label>
                <input type="text" id="b-name" required placeholder="أدخل اسمك الكريم">
                <label>رقم الهاتف المتحرك:</label>
                <input type="tel" id="b-phone" required placeholder="0501234567">
                <label>العنوان التفصيلي:</label>
                <input type="text" id="b-address" required placeholder="مثال: دبي، مارينا، برج 1">
                <button type="submit" class="btn" style="margin-top: 10px;">تأكيد الحجز والدفع الآمن ✓</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('booking-form').onsubmit = function(e) {
            e.preventDefault();
            const payload = {
                service: 'فحص PCR المنزلي',
                name: document.getElementById('b-name').value,
                phone: document.getElementById('b-phone').value,
                address: document.getElementById('b-address').value,
                date: document.getElementById('b-date').value
            };
            fetch('/api/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(res => {
                alert('تم تأكيد حجزك بنجاح! رقم الطلب: #' + (res.orderId || 1001));
                window.location.href = '/';
            }).catch(() => {
                alert('تم تقديم الحجز بنجاح!');
                window.location.href = '/';
            });
        };
    </script>
</body>
</html>
