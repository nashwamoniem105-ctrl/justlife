<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز الخدمة | Justlife</title>
<style>
@font-face{font-family:JL;src:url('/assets/f554312121118e65b5.woff')}@font-face{font-family:JL;src:url('/assets/fb4ee86aa0e9efe49b.woff');font-weight:700}
:root{--ink:#1d1d1d;--muted:#777;--line:#e8e8e8;--yellow:#ffd33d;--blue:#10b7e8;--bg:#fafafa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:JL,Arial,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;direction:ltr}.logo{font-size:30px;font-weight:700;color:#05b9df;letter-spacing:-2px}.top a{color:var(--ink);text-decoration:none;margin:0 14px;font-size:14px}.layout{max-width:1080px;margin:32px auto;padding:0 18px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;direction:ltr}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 3px 14px #00000008;direction:rtl}.main{min-height:590px}.summary h3{margin-top:0}.steps{display:flex;gap:8px;margin:0 0 26px;direction:rtl}.step{height:8px;border-radius:8px;background:#e8e8e8;flex:1}.step.active{background:var(--yellow)}h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:24px 0 12px}.sub{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{border:1px solid #ddd;background:#fff;border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;font:inherit}.choice.selected{border-color:var(--blue);background:#eafaff;color:#0785ae;font-weight:700}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;border-radius:9px;padding:13px;font:inherit;background:#fff}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:10px;margin-top:28px}.btn{border:0;border-radius:25px;padding:14px 26px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--yellow);flex:1}.secondary{background:#f1f1f1}.notice{background:#fff8d8;border-radius:9px;padding:12px;margin:18px 0;color:#6f5a00}.price{font-size:28px;font-weight:700;margin:12px 0}.summary dl{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:700}.safe{font-size:13px;color:var(--muted);line-height:1.7}.success{text-align:center;padding:36px 8px}.success .mark{width:70px;height:70px;background:#dff8e8;color:#159447;border-radius:50%;display:grid;place-items:center;font-size:36px;margin:0 auto 16px}@media(max-width:760px){.layout{display:block;margin:15px auto}.summary{margin-top:16px}.grid{grid-template-columns:repeat(4,1fr)}.top{padding:0 18px}.top a{margin:0 4px}.card{padding:20px}}
</style></head>
<body>
<header class="top"><div><a href="/ar-AE">الرئيسية</a><a href="/ar-AE/faq">التعليمات</a></div><div class="logo">justlife</div></header>
<div class="layout"><main class="card main"><div class="steps"><span class="step active"></span><span class="step"></span><span class="step"></span><span class="step"></span></div><div id="app"></div></main><aside class="card summary"><h3>ملخص الحجز</h3><dl><dt>الخدمة</dt><dd id="sum-service">—</dd><dt>التاريخ</dt><dd id="sum-date">—</dd><dt>الموعد</dt><dd id="sum-time">—</dd><dt>الإضافات</dt><dd id="sum-extra">—</dd></dl><div>الإجمالي التجريبي</div><div class="price">78.00 د.إ</div><p class="safe">هذه صفحة دفع تجريبية. لن يتم خصم أي مبلغ ولن تُرسل بيانات البطاقة إلى أي جهة خارجية.</p></aside></div>
<script>
const slug=location.pathname.split('/').filter(Boolean)[1]||'house-cleaning';const labels={'house-cleaning':'التنظيف المنزلي','maid-service':'خدمة العاملة','ac-cleaning':'تنظيف أجهزة التكييف','deep-cleaning':'التنظيف العميق','carpet-cleaning':'تنظيف السجاد','sofa-cleaning':'تنظيف الكنب','salon-services-at-home':'صالون التجميل في المنزل','spa-and-massage-service-at-home':'التدليك والمنتجعات الصحية'};const service=labels[slug]||slug.replaceAll('-',' ');let state=JSON.parse(localStorage.getItem('jl-demo-booking')||'{}');state.service=service;let step=Number(new URLSearchParams(location.search).get('step')||1);const app=document.getElementById('app');document.getElementById('sum-service').textContent=service;
function save(){localStorage.setItem('jl-demo-booking',JSON.stringify(state));document.getElementById('sum-date').textContent=state.date||'—';document.getElementById('sum-time').textContent=state.time||'—';document.getElementById('sum-extra').textContent=state.hours?state.hours+' ساعات':'—'}function go(n){step=n;history.replaceState({},'',location.pathname+'?step='+n);render()}function choose(key,value){state[key]=value;save();render()}
function render(){document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('active',i<step));if(step===1)stepOne();else if(step===2)stepTwo();else if(step===3)stepThree();else if(step===4)stepFour();save()}
function stepOne(){app.innerHTML=`<h1>${service}</h1><p class="sub">الخطوة 1 من 4 — خصّص حجزك</p><div class="notice">عرض حصري لأجلك! استخدم الكود <b>50MOP</b> للحصول على خصم تجريبي.</div><h2>كم ساعة تريد؟</h2><div class="grid">${[1,2,3,4,5,6,7].map(x=>`<button class="choice ${state.hours==x?'selected':''}" onclick="choose('hours',${x})">${x}</button>`).join('')}</div><h2>عدد المهنيين</h2><div class="grid">${[1,2,3,4].map(x=>`<button class="choice ${state.pros==x?'selected':''}" onclick="choose('pros',${x})">${x}</button>`).join('')}</div><h2>هل تحتاج إلى مواد تنظيف؟</h2><div class="grid"><button class="choice ${state.supplies==='no'?'selected':''}" onclick="choose('supplies','no')">لا، لدي منهم</button><button class="choice ${state.supplies==='yes'?'selected':''}" onclick="choose('supplies','yes')">نعم</button></div><div class="field"><label>أي تعليمات خاصة؟</label><textarea maxlength="150" oninput="state.note=this.value;save()" placeholder="مفتاح تحت السجاد، كوي، تنظيف الشباك إلخ.">${state.note||''}</textarea></div><div class="actions"><button class="btn primary" onclick="go(2)">التالي</button></div>`}
function stepTwo(){app.innerHTML=`<h1>اختيار الموعد والموقع</h1><p class="sub">الخطوة 2 من 4 — أين ومتى تريد الخدمة؟</p><div class="field"><label>العنوان</label><input value="${state.address||''}" oninput="state.address=this.value;save()" placeholder="المنطقة، الشارع، المبنى" /></div><div class="field"><label>التاريخ</label><input type="date" value="${state.date||''}" oninput="state.date=this.value;save()" /></div><div class="field"><label>الوقت</label><select onchange="state.time=this.value;save()"><option value="">اختر الوقت</option>${['09:00','11:00','13:00','15:00','17:00'].map(x=>`<option ${state.time===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="btn secondary" onclick="go(1)">السابق</button><button class="btn primary" onclick="go(3)">التالي</button></div>`}
function stepThree(){app.innerHTML=`<h1>بيانات العميل</h1><p class="sub">الخطوة 3 من 4 — أدخل بيانات التواصل</p><div class="field"><label>الاسم الكامل</label><input value="${state.name||''}" oninput="state.name=this.value;save()" placeholder="الاسم الكامل" /></div><div class="field"><label>رقم الهاتف</label><input value="${state.phone||''}" oninput="state.phone=this.value;save()" placeholder="05xxxxxxxx" /></div><div class="field"><label>البريد الإلكتروني</label><input type="email" value="${state.email||''}" oninput="state.email=this.value;save()" placeholder="name@example.com" /></div><div class="actions"><button class="btn secondary" onclick="go(2)">السابق</button><button class="btn primary" onclick="go(4)">مراجعة ودفع</button></div>`}
function stepFour(){app.innerHTML=`<h1>الدفع التجريبي</h1><p class="sub">الخطوة 4 من 4 — راجع حجزك وأكمل العملية التجريبية</p><div class="notice">وضع الاختبار مفعّل: لن يتم تحصيل أي مبلغ حقيقي.</div><div class="field"><label>رقم البطاقة التجريبي</label><input inputmode="numeric" placeholder="4242 4242 4242 4242" value="${state.card||''}" oninput="state.card=this.value;save()" /></div><div class="grid"><div class="field"><label>تاريخ الانتهاء</label><input placeholder="12/30" value="${state.expiry||''}" oninput="state.expiry=this.value;save()" /></div><div class="field"><label>CVV</label><input placeholder="123" value="${state.cvv||''}" oninput="state.cvv=this.value;save()" /></div></div><p class="safe">استخدم 4242 4242 4242 4242 لمحاكاة نجاح الدفع، أو 4000 0000 0000 0002 لمحاكاة فشل الدفع. هذه الأرقام لا تُرسل إلى مزود دفع حقيقي.</p><div class="actions"><button class="btn secondary" onclick="go(3)">السابق</button><button class="btn primary" onclick="pay()">إتمام الدفع</button></div>`}
function pay(){if((state.card||'').replaceAll(' ','')==='4000000000000002'){alert('تمت محاكاة فشل الدفع. جرّب البطاقة التجريبية الناجحة.');return}if((state.card||'').replaceAll(' ','')!=='4242424242424242'){alert('أدخل رقم البطاقة التجريبي 4242 4242 4242 4242');return}fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_name:service,customer_name:state.name||'عميل تجريبي',phone:state.phone||'N/A',address:state.address||'N/A',booking_date:state.date||new Date().toISOString()})}).catch(()=>{});app.innerHTML=`<div class="success"><div class="mark">✓</div><h1>تم تأكيد حجزك التجريبي</h1><p class="sub">رقم الحجز: JL-DEMO-${Date.now().toString().slice(-6)}</p><p>تمت محاكاة الدفع بنجاح. لا يوجد أي تحصيل مالي حقيقي.</p><div class="actions"><button class="btn primary" onclick="localStorage.removeItem('jl-demo-booking');location.href='/ar-AE'">العودة للرئيسية</button></div></div>`;document.querySelectorAll('.step').forEach(x=>x.classList.add('active'))}render();
</script></body></html>
