<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Justlife Booking</title><style>
@font-face{font-family:JL;src:url('/assets-local/hkgrotesk-regular-webfont.woff')}@font-face{font-family:JL;src:url('/assets-local/hkgrotesk-bold-webfont.woff');font-weight:700}:root{--ink:#202124;--muted:#777;--line:#e7e7e7;--yellow:#ffd23f;--blue:#09b9e5;--soft:#fafafa}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:JL,Arial,sans-serif}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#fff}.logo{font-size:30px;font-weight:700;color:#04bce4;letter-spacing:-2px}.top a{color:#222;text-decoration:none;margin-left:24px;font-size:14px}.layout{max-width:1080px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:18px}.card{border:1px solid #e4e4e4;border-radius:8px;background:#fff;padding:18px}.main{min-height:560px}.summary{height:max-content}.crumb{font-size:13px;color:#555;margin-bottom:14px}.back{display:inline-block;color:#222;text-decoration:none;margin-bottom:14px}.step-label{font-size:14px;font-weight:700;margin-bottom:6px}.steps{display:flex;gap:5px;margin-bottom:22px}.step{height:5px;border-radius:4px;background:#eee;flex:1}.step.active{background:var(--yellow)}h1{font-size:23px;margin:0 0 18px}h2{font-size:16px;margin:22px 0 10px}.offer{border:1px solid #eee;border-radius:6px;padding:12px;margin-bottom:20px}.offer b{font-size:18px}.offer small{display:block;color:#666;margin-top:3px}.apply{float:right;background:var(--blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-weight:700}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{min-width:48px;border:1px solid #ddd;background:#fff;border-radius:22px;padding:10px 16px;cursor:pointer;font:inherit}.choice.selected{border-color:var(--blue);background:#e7fbff;color:#008cae}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9d9d9;border-radius:5px;padding:12px;font:inherit}.field textarea{min-height:85px;resize:vertical}.info{background:#f7ffff;border:1px solid #d8f4f7;padding:10px;border-radius:5px;font-size:12px;margin-top:18px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:22px;padding:13px 25px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--yellow);flex:1}.secondary{background:#f2f2f2}.summary h3{margin:0 0 18px}.summary dl{display:grid;grid-template-columns:1fr auto;gap:14px;border-bottom:1px solid #eee;padding-bottom:18px}.summary dt{color:#999}.summary dd{margin:0;font-weight:700;text-align:right}.total{font-size:24px;font-weight:700;margin-top:18px}.muted{color:#888;font-size:13px}.success{text-align:center;padding:48px 10px}.success-mark{font-size:44px;color:#159447}.rtl{direction:rtl}@media(max-width:760px){.layout{display:block;margin:12px auto}.summary{margin-top:14px}.top{padding:0 18px}.top a{margin-left:8px}}
</style></head><body><header class="top"><a class="logo" href="/en-AE">justlife</a><nav><a id="homeLink" href="/en-AE">HOME</a><a id="langLink" href="#">العربية</a></nav></header><div class="layout"><main class="card main"><a id="backLink" class="back" href="#">← Back</a><div class="step-label" id="stepLabel"></div><div class="steps"><span class="step active"></span><span class="step"></span><span class="step"></span><span class="step"></span></div><div id="app"></div></main><aside class="card summary"><h3 id="summaryTitle">Booking Details</h3><dl><dt id="serviceLabel">Service</dt><dd id="sum-service">—</dd><dt id="durationLabel">Duration</dt><dd id="sum-duration">—</dd><dt id="prosLabel">Number of Professionals</dt><dd id="sum-pros">—</dd><dt id="extraLabel">Details</dt><dd id="sum-extra">—</dd></dl><div id="paymentLabel" class="muted">Payment Summary</div><div class="total">AED <span id="sum-total">78.00</span></div></aside></div><script>
const parts=location.pathname.split('/').filter(Boolean), lang=parts[0]==='ar-AE'?'ar':'en', slug=parts[1]||'house-cleaning';
const ar=lang==='ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
const cfg={
 'house-cleaning':{title:'Home Cleaning',arTitle:'تنظيف المنازل',type:'home',hours:[1,2,3,4,5,6,7,8],pros:[1,2,3,4],price:78},
 'home-cleaning':{title:'Home Cleaning',arTitle:'تنظيف المنازل',type:'home',hours:[1,2,3,4,5,6,7,8],pros:[1,2,3,4],price:78},
 'maid-service':{title:'Maid Service',arTitle:'خدمة العاملة المنزلية',type:'home',hours:[4,5,6,7,8,9,10,12],pros:[1,2],price:120},
 'deep-cleaning':{title:'Deep Cleaning',arTitle:'التنظيف العميق',type:'home',hours:[3,4,5,6,7,8],pros:[1,2,3],price:180},
 'carpet-cleaning':{title:'Carpet Cleaning',arTitle:'تنظيف السجاد',type:'area',areas:['1 room','2 rooms','3 rooms','4 rooms','5+ rooms'],arAreas:['غرفة واحدة','غرفتان','3 غرف','4 غرف','أكثر من 5 غرف'],price:150},
 'sofa-cleaning':{title:'Sofa Cleaning',arTitle:'تنظيف الكنب',type:'area',areas:['2 seats','3 seats','4 seats','5+ seats'],arAreas:['مقعدان','3 مقاعد','4 مقاعد','أكثر من 5'],price:120},
 'salon-services-at-home':{title:"Women's Salon",arTitle:'صالون السيدات',type:'beauty',services:['Hair Styling','Manicure','Pedicure','Makeup'],arServices:['تصفيف الشعر','مانيكير','باديكير','مكياج'],price:180},
 'spa-and-massage-service-at-home':{title:"Women's Spa",arTitle:'سبا ومساج للسيدات',type:'beauty',services:['Relaxation Massage','Deep Tissue Massage','Facial','Body Scrub'],arServices:['مساج استرخائي','مساج عميق','جلسة عناية بالوجه','تقشير الجسم'],price:220},
 'plumber-services':{title:'Plumber Services',arTitle:'خدمات السباكة',type:'trade',services:['Leak repair','Pipe installation','Drain cleaning','Other'],arServices:['إصلاح تسرب','تركيب أنابيب','تسليك صرف','أخرى'],price:99},
 'handyman-services':{title:'Handyman Services',arTitle:'خدمات الصيانة',type:'trade',services:['General maintenance','Furniture assembly','Wall mounting','Other'],arServices:['صيانة عامة','تركيب أثاث','تثبيت جداري','أخرى'],price:99},
 'electrician-services':{title:'Electrician Services',arTitle:'خدمات الكهرباء',type:'trade',services:['Electrical repair','Lighting installation','Switch/socket repair','Other'],arServices:['إصلاح كهرباء','تركيب إضاءة','إصلاح مفتاح/مقبس','أخرى'],price:99}
};const c=cfg[slug]||{title:slug.replaceAll('-',' '),arTitle:slug.replaceAll('-',' '),type:'trade',services:['General service','Inspection','Other'],arServices:['خدمة عامة','فحص','أخرى'],price:99};
const T={step:n=>ar?'الخطوة '+n+' من 4':'Step '+n+' of 4',back:ar?'← رجوع':'← Back',apply:ar?'تطبيق':'Apply',offer:ar?'عرض حصري لأجلك!':'Exclusive offer for you!',code:ar?'الرمز: 50MOP':'Code: 50MOP',hours:ar?'كم ساعة تحتاج؟':'How many hours do you need your professional to stay?',pros:ar?'كم عدد المهنيين؟':'How many professionals do you need?',materials:ar?'هل تحتاج إلى مواد تنظيف؟':'Need cleaning materials?',no:ar?'لا، لدي المواد':'No, I have them',yes:ar?'نعم، من فضلك':'Yes, please',instructions:ar?'أي تعليمات أو متطلبات خاصة؟':'Any instructions or special requirements?',placeholder:ar?'مثال: المفتاح تحت السجادة، كي الملابس، تنظيف النوافذ...':'Example: Key under the mat, ironing, window cleaning, etc.',next:ar?'التالي':'Next',previous:ar?'السابق':'Previous',details:ar?'تفاصيل الحجز':'Booking Details',service:ar?'الخدمة':'Service',duration:ar?'المدة':'Duration',prosLabel:ar?'عدد المهنيين':'Number of Professionals',payment:ar?'ملخص الدفع':'Payment Summary',choose:ar?'اختر خيارًا':'Choose an option',address:ar?'العنوان':'Address',date:ar?'التاريخ':'Date',time:ar?'الوقت':'Time',name:ar?'الاسم الكامل':'Full name',phone:ar?'رقم الهاتف':'Phone number',email:ar?'البريد الإلكتروني':'Email',review:ar?'المراجعة والتأكيد':'Review and confirm'};
let state=JSON.parse(localStorage.getItem('jl-demo-booking-'+slug)||'{}'),step=Number(new URLSearchParams(location.search).get('step')||1);const app=document.getElementById('app');
function label(v,arr){return ar&&arr?arr[arr.indexOf(v)]||v:v}function save(){localStorage.setItem('jl-demo-booking-'+slug,JSON.stringify(state));document.getElementById('sum-service').textContent=ar?c.arTitle:c.title;document.getElementById('sum-duration').textContent=state.hours?(state.hours+(ar?' ساعة':' hours')):(state.duration||'—');document.getElementById('sum-pros').textContent=state.pros||'—';document.getElementById('sum-extra').textContent=state.option||state.materials||'—';document.getElementById('sum-total').textContent=c.price+(Number(state.hours||0)-2)*10}
function choose(k,v){state[k]=v;save();render()}function go(n){step=n;history.replaceState({},'',location.pathname+'?step='+n);render()}function choice(k,v,text,selected){return `<button class="choice ${selected?'selected':''}" onclick="choose('${k}',${JSON.stringify(v)})">${text}</button>`}
function stepOne(){let html=`<h1>${ar?c.arTitle:c.title}</h1><div class="offer"><b>${T.offer}</b><small>${T.code}</small><button class="apply">${T.apply}</button></div>`;if(c.type==='home'){html+=`<h2>${T.hours}</h2><div class="choices">${c.hours.map(v=>choice('hours',v,v,state.hours==v)).join('')}</div><h2>${T.pros}</h2><div class="choices">${c.pros.map(v=>choice('pros',v,v,state.pros==v)).join('')}</div><h2>${T.materials}</h2><div class="choices">${choice('materials','no',T.no,state.materials==='no')}${choice('materials','yes',T.yes,state.materials==='yes')}</div>`}else if(c.type==='area'){html+=`<h2>${ar?'اختر الحجم أو المساحة':'Choose the size or area'}</h2><div class="choices">${c.areas.map((v,i)=>choice('option',v,label(v,c.arAreas),state.option===v)).join('')}</div>`}else if(c.type==='beauty'||c.type==='trade'){html+=`<h2>${ar?'اختر الخدمة المطلوبة':'Choose your service'}</h2><div class="choices">${c.services.map((v,i)=>choice('option',v,label(v,c.arServices),state.option===v)).join('')}</div><h2>${ar?'المدة التقريبية':'Estimated duration'}</h2><div class="choices">${[1,2,3,4].map(v=>choice('duration',v,(v+(ar?' ساعة':' hour'+(v>1?'s':''))),state.duration==v)).join('')}</div>`}html+=`<div class="field"><label>${T.instructions}</label><textarea maxlength="150" oninput="state.note=this.value;save()" placeholder="${T.placeholder}">${state.note||''}</textarea></div><div class="info">${ar?'تختلف مدة الخدمة حسب نوعها وحجم المكان.':'Duration and availability depend on the selected service and location.'}</div><div class="actions"><button class="btn primary" onclick="go(2)">${T.next}</button></div>`;app.innerHTML=html}
function stepTwo(){app.innerHTML=`<h1>${ar?'الموعد والموقع':'Date, time and location'}</h1><div class="field"><label>${T.address}</label><input value="${state.address||''}" oninput="state.address=this.value;save()" placeholder="${ar?'المنطقة، المبنى، الشقة':'Area, building, apartment'}"></div><div class="field"><label>${T.date}</label><input type="date" value="${state.date||''}" oninput="state.date=this.value;save()"></div><div class="field"><label>${T.time}</label><select onchange="state.time=this.value;save()"><option value="">${T.choose}</option>${['09:00','11:00','13:00','15:00','17:00'].map(v=>`<option ${state.time===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="actions"><button class="btn secondary" onclick="go(1)">${T.previous}</button><button class="btn primary" onclick="go(3)">${T.next}</button></div>`}
function stepThree(){app.innerHTML=`<h1>${ar?'بيانات التواصل':'Contact details'}</h1><div class="field"><label>${T.name}</label><input value="${state.name||''}" oninput="state.name=this.value;save()"></div><div class="field"><label>${T.phone}</label><input value="${state.phone||''}" oninput="state.phone=this.value;save()"></div><div class="field"><label>${T.email}</label><input type="email" value="${state.email||''}" oninput="state.email=this.value;save()"></div><div class="actions"><button class="btn secondary" onclick="go(2)">${T.previous}</button><button class="btn primary" onclick="go(4)">${T.review}</button></div>`}
function stepFour(){app.innerHTML=`<h1>${ar?'تأكيد الحجز':'Confirm booking'}</h1><p>${ar?'راجع تفاصيل حجزك قبل التأكيد.':'Review your booking details before confirming.'}</p><div class="info">${ar?'هذا عرض تجريبي محلي؛ لن يتم تحصيل أي مبلغ.':'This is a local demo booking; no payment will be charged.'}</div><div class="actions"><button class="btn secondary" onclick="go(3)">${T.previous}</button><button class="btn primary" onclick="finish()">${ar?'تأكيد الحجز':'Confirm booking'}</button></div>`}
function finish(){fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_name:ar?c.arTitle:c.title,customer_name:state.name||'Demo customer',phone:state.phone||'N/A',address:state.address||'N/A',booking_date:state.date||new Date().toISOString()})}).catch(()=>{});app.innerHTML=`<div class="success"><div class="success-mark">✓</div><h1>${ar?'تم تأكيد الحجز':'Booking confirmed'}</h1><p>${ar?'تم حفظ طلبك التجريبي بنجاح.':'Your demo booking was saved successfully.'}</p><div class="actions"><a class="btn primary" href="/${ar?'ar-AE':'en-AE'}">${ar?'العودة للرئيسية':'Return home'}</a></div></div>`;document.querySelectorAll('.step').forEach(x=>x.classList.add('active'))}
function render(){document.getElementById('stepLabel').textContent=T.step(step);document.getElementById('backLink').href=`/${ar?'ar-AE':'en-AE'}/${slug}`;document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('active',i<step));document.getElementById('summaryTitle').textContent=T.details;document.getElementById('serviceLabel').textContent=T.service;document.getElementById('durationLabel').textContent=T.duration;document.getElementById('prosLabel').textContent=T.prosLabel;document.getElementById('paymentLabel').textContent=T.payment;save();if(step===1)stepOne();else if(step===2)stepTwo();else if(step===3)stepThree();else stepFour()}render();
</script></body></html>
